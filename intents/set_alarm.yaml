id: set_alarm
patterns:
  - "(setel|pasang|atur|set|buat) alarm [(jam|pukul) {time} [{period}]]"
  - "(bangunkan|bangunin) (aku|saya) [besok] (jam|pukul) {time} [{period}]"
  - "[besok] [{period}] (jam|pukul) {time} (bangunkan|bangunin) (aku|saya)"
slots:
  time:
    type: clock
  period:
    type: enum
    values: [pagi, siang, sore, malam]
examples:
  - "pasang alarm jam 5 pagi"
  - "bangunkan saya jam 6.30"
action: set_alarm         # tanpa {time}: tool menanyakan jamnya
confirmation: never
needs_network: false
