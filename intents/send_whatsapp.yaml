id: send_whatsapp
patterns:
  - "(kirim|kirimkan) [pesan] whatsapp ke {contact} (bilang|isinya|yang isinya) {message}"
  - "whatsapp {contact} (bilang|isinya) {message}"
  - "(kirim|kirimkan) [pesan] whatsapp ke {contact} {message}"
slots:
  contact:
    type: contact
  message:
    type: text
examples:
  - "kirim wa ke budi bilang besok rapat jam 9"
action: send_whatsapp
confirmation: always
needs_network: false      # WhatsApp sendiri yang mengantre pesan bila offline
