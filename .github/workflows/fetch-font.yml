# Sekali jalan: mengambil font PixelOperator (CC0 1.0, Jayvee Enaguas) dan meng-commit-nya
# ke res/font/. Sandbox pengembangan tidak bisa menjangkau dafont.com, runner GitHub bisa.
# Workflow ini dihapus lagi setelah font masuk ke repo.
name: fetch-font

on:
  push:
    branches: [arena/01a0d31f-rbitassistant]
    paths: [.github/workflows/fetch-font.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Unduh PixelOperator
        run: |
          set -euo pipefail
          mkdir -p /tmp/po && cd /tmp/po
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          got=""
          for url in "https://dl.dafont.com/dl/?f=pixel_operator" "https://www.dafont.com/dl/?f=pixel_operator"; do
            if curl -fsSL --retry 3 -A "$UA" -e "https://www.dafont.com/pixel-operator.font" -o po.zip "$url" && unzip -tq po.zip; then
              unzip -oq po.zip -d x && got="$url" && break
            fi
          done
          if [ -z "$got" ]; then
            git clone --depth 1 https://notabug.org/HarvettFox96/ttf-pixeloperator.git x && got="notabug"
          fi
          echo "::notice title=Sumber font::$got"
          echo "::notice title=Isi arsip::$(cd x && find . -type f | sort | tr '\n' ' ')"
          reg=$(find x -type f -iname 'PixelOperator.ttf' | head -1)
          bold=$(find x -type f -iname 'PixelOperator-Bold.ttf' | head -1)
          test -n "$reg" && test -n "$bold"
          for f in "$reg" "$bold"; do
            magic=$(head -c4 "$f" | xxd -p)
            [ "$magic" = "00010000" ] || [ "$magic" = "74727565" ] || { echo "::error::$f bukan TrueType ($magic)"; exit 1; }
          done
          dst="$GITHUB_WORKSPACE/app/src/main/res/font"
          mkdir -p "$dst"
          cp "$reg" "$dst/pixel_operator.ttf"
          cp "$bold" "$dst/pixel_operator_bold.ttf"
          lic=$(find x -type f \( -iname '*licen*' -o -iname '*readme*' -o -iname '*copying*' \) | head -3 | tr '\n' ' ')
          echo "::notice title=Berkas lisensi di arsip::${lic:-tidak ada}"
          for f in $lic; do echo "===== $f"; cat "$f"; done
          cd "$dst" && echo "::notice title=SHA-256 font::$(sha256sum *.ttf | tr '\n' ' ')"

      - name: Commit ke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/font
          git commit -m "chore(font): tambah PixelOperator & PixelOperator-Bold (CC0 1.0)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
