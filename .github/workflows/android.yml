name: android

on:
  push:
    branches: [arena/01a0d31f-rbitassistant, main]
  workflow_dispatch:

permissions:
  contents: write   # untuk membuat GitHub Release berisi APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      apk: ${{ steps.apk.outputs.name }}
      sha: ${{ steps.apk.outputs.sha }}
      size: ${{ steps.apk.outputs.size }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pemeriksa dokumen & katalog (Python)
        run: |
          pip install -q pyyaml
          python tools/check_docs.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Kunci tanda tangan dari secret (opsional)
        env:
          KS_B64: ${{ secrets.RBIT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RBIT_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RBIT_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RBIT_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rbit.p12"
            {
              echo "RBIT_KEYSTORE_PATH=$RUNNER_TEMP/rbit.p12"
              echo "RBIT_KEYSTORE_PASSWORD=$KS_PASS"
              echo "RBIT_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
              echo "RBIT_KEY_ALIAS=${KEY_ALIAS:-rbitassistant}"
            } >> "$GITHUB_ENV"
            echo "::notice title=Tanda tangan::memakai kunci dari GitHub Secrets"
          else
            echo "::warning title=Tanda tangan::memakai kunci DEV publik (app/signing/README.md)"
          fi

      - name: Tes router + build APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Laporkan galat sebagai annotation
        if: failure()
        run: python .github/scripts/annotate.py build.log

      - name: Siapkan APK
        id: apk
        run: |
          name="rbitassistant-0.1.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$name" | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}


  smoke:
    # Uji asap di emulator Android 15: APK baru diterbitkan hanya jika aplikasi bisa dibuka
    # tanpa crash dan perintah dasar dibalas.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator + uji asap
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh ${{ needs.build.outputs.apk }}

  release:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}
      - name: Terbitkan sebagai GitHub Release (pra-rilis)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK: ${{ needs.build.outputs.apk }}
          SHA: ${{ needs.build.outputs.sha }}
          SIZE: ${{ needs.build.outputs.size }}
        run: |
          tag="v0.1.${{ github.run_number }}"
          {
            echo "APK uji untuk Infinix GT 30 Pro (Android 15), dibangun otomatis dari commit ${GITHUB_SHA}."
            echo
            echo "**Cara pasang:** unduh \`$APK\` di HP, buka, izinkan \"Instal aplikasi tidak dikenal\" untuk browser/File Manager, lalu Instal."
            echo
            echo "- Ukuran: $SIZE"
            echo "- SHA-256: \`$SHA\`"
          } > notes.md
          gh release create "$tag" "$APK" --target "$GITHUB_SHA" --prerelease \
            --title "Rbit Asisten 0.1.${{ github.run_number }}" --notes-file notes.md
          echo "::notice title=APK siap::https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"
